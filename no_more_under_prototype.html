<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No More Under | Program Workspace</title>
<style>
:root{--navy:#153b4a;--teal:#167d80;--mint:#e8f4f1;--ink:#20333b;--muted:#718087;--line:#e3e9e8;--bg:#f5f8f7;--white:#fff;--amber:#a86b19;--red:#b64d4d;--shadow:0 8px 28px #183b4510}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:246px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:4}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 30px}.brandmark{width:38px;height:38px;border-radius:12px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:800;font-size:17px}.brand strong{display:block;font-size:15px;letter-spacing:.01em}.brand small{color:var(--muted);font-size:11px}.navlabel{font-size:10px;color:#9aa6a8;font-weight:800;letter-spacing:.12em;padding:12px 12px 8px}.nav button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:transparent;color:#65757a;padding:11px 12px;border-radius:9px;margin:2px 0;font-weight:600}.nav button.active,.nav button:hover{background:var(--mint);color:var(--navy)}.ico{width:19px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:17px 8px 0}.rolebox{background:#f6f9f8;border:1px solid var(--line);padding:12px;border-radius:10px}.rolebox label{font-size:10px;color:var(--muted);font-weight:800;display:block;margin-bottom:6px}.rolebox select{width:100%;border:0;background:transparent;color:var(--navy);font-weight:700;outline:none}.main{margin-left:246px;width:calc(100% - 246px)}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:3}.crumb{color:var(--muted);font-size:12px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;background:#d9ece7;color:var(--navy);border-radius:50%;display:grid;place-items:center;font-weight:800}.profile b{font-size:12px;display:block}.profile small{color:var(--muted);font-size:11px}.content{max-width:1440px;margin:auto;padding:32px 36px 60px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px;gap:18px}.eyebrow{color:var(--teal);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:7px}.pagehead h1{font-size:27px;letter-spacing:-.035em;margin:0 0 5px;color:#173b48}.pagehead p{margin:0;color:var(--muted)}.btn{padding:10px 15px;border-radius:8px;background:var(--teal);color:#fff;font-weight:700;box-shadow:0 3px 8px #167d8025}.btn:hover{background:#116b6e}.btn.secondary{background:white;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.ghost{background:transparent;color:var(--teal);box-shadow:none;padding:7px}.btn.danger{background:#fff4f3;color:var(--red);box-shadow:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:32px;height:32px;background:var(--mint);color:var(--teal);border-radius:9px;display:grid;place-items:center}.stat strong{display:block;font-size:27px;margin:12px 0 2px;color:var(--navy)}.stat small{color:var(--muted)}.panel{padding:21px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}.panelhead h2{font-size:16px;margin:0;color:var(--navy)}.panelhead p{margin:3px 0 0;color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#879397;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:11px 12px;border-bottom:1px solid var(--line);font-weight:800}td{padding:14px 12px;border-bottom:1px solid #edf1f0;font-size:12px}tr:last-child td{border-bottom:0}td strong{font-size:12px;color:#24434d}.muted{color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800;background:#eef3f2;color:#5f7276}.pill.green{background:#e7f5ef;color:#267650}.pill.amber{background:#fff4e2;color:#9a671d}.pill.red{background:#fff0ef;color:#b34f49}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.field{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;min-width:190px;color:var(--ink);outline:none}.field:focus{border-color:#65aaa5;box-shadow:0 0 0 3px #167d8015}.search{flex:1;min-width:220px}.rowtitle{display:flex;align-items:center;gap:10px}.miniavatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#e7f1ef;color:#23616a;font-weight:800;font-size:10px}.actions{display:flex;gap:5px}.linkbtn{background:transparent;color:var(--teal);font-size:11px;font-weight:800;padding:5px}.section-note{padding:12px 14px;border-radius:9px;background:#f2f8f6;color:#58716f;font-size:12px;margin-top:12px}.hidden{display:none!important}.progress{height:7px;border-radius:10px;background:#edf2f1;overflow:hidden}.progress span{display:block;height:100%;background:var(--teal);border-radius:10px}.taskrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #edf1f0}.taskrow:last-child{border:0}.check{width:18px;height:18px;border:1.5px solid #b8c8c5;border-radius:5px;display:grid;place-items:center;color:white;flex:none}.taskrow.done .check{background:var(--teal);border-color:var(--teal)}.taskmeta{flex:1}.taskmeta b{font-size:12px}.taskmeta small{display:block;color:var(--muted);font-size:11px}.daylist{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.day{border:1px solid var(--line);border-radius:10px;padding:13px 10px;background:#fff}.day .num{font-size:10px;color:var(--teal);font-weight:800;text-transform:uppercase}.day b{display:block;margin:7px 0 4px;font-size:12px}.day small{color:var(--muted);font-size:10px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.datebox{background:#f7faf9;padding:13px;border-radius:9px}.datebox small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.datebox b{display:block;margin-top:5px;font-size:15px;color:var(--navy)}.modalback{position:fixed;inset:0;background:#102b32a6;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(560px,100%);background:#fff;border-radius:15px;padding:24px;box-shadow:0 20px 70px #102b3240;max-height:90vh;overflow:auto}.modal h2{margin:0 0 5px;color:var(--navy);font-size:20px}.modal>p{margin:0 0 19px;color:var(--muted);font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgroup{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.formgroup label{font-size:11px;font-weight:800;color:#607277}.formgroup input,.formgroup select,.formgroup textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;outline:none}.formgroup textarea{min-height:75px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;right:25px;bottom:25px;background:#173f4b;color:white;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:20}.empty{text-align:center;padding:35px;color:var(--muted)}.smallcaps{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}.access{display:flex;gap:9px;align-items:flex-start;background:#fff8e9;border:1px solid #f2e3c7;color:#80602c;padding:13px;border-radius:9px;font-size:12px;margin-bottom:16px}
@media(max-width:900px){.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:25px 20px}}@media(max-width:650px){.sidebar{width:62px;padding:16px 7px}.brand{padding:0 4px 25px}.brand div:not(.brandmark),.navlabel,.nav button span:not(.ico),.rolebox label{display:none}.brandmark{width:42px}.nav button{justify-content:center;padding:12px 5px}.side-bottom{padding:12px 0 0}.rolebox{padding:7px 2px}.rolebox select{font-size:9px;width:100%;padding:0}.main{margin-left:62px;width:calc(100% - 62px)}.topbar{padding:0 15px}.content{padding:22px 13px}.pagehead{flex-direction:column}.cards{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.daylist{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">N</div><div><strong>NO MORE UNDER</strong><small>Program workspace</small></div></div>
 <div class="navlabel">WORKSPACE</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span><span>Dashboard</span></button>
  <button data-page="projects"><span class="ico">▤</span><span>Projects</span></button>
  <button data-page="tasks"><span class="ico">✓</span><span>My Tasks</span></button>
  <div class="navlabel">ADMINISTRATION</div>
  <button data-page="users"><span class="ico">♙</span><span>User Management</span></button>
  <button data-page="archive"><span class="ico">▣</span><span>Archive</span></button>
 </nav>
 <div class="side-bottom"><div class="rolebox"><label>PREVIEW AS ROLE</label><select id="roleSelect"><option>Admin</option><option>Staff</option><option>Partner</option></select></div></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">Workspace <span class="muted">/</span> <b id="crumb">Dashboard</b></div><div class="profile"><div class="avatar">AM</div><div><b id="profileName">Alex Morgan</b><small id="profileRole">Administrator</small></div></div></header>
<div class="content" id="view"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const state={role:'Admin',page:'dashboard',selected:null,users:[
{id:1,name:'Alex Morgan',email:'alex@nomoreunder.org',role:'Admin',program:'All programs'},
{id:2,name:'Jordan Lee',email:'jordan@nomoreunder.org',role:'Staff',program:'Swim Safely — Spring'},
{id:3,name:'Taylor Brooks',email:'taylor@nomoreunder.org',role:'Staff',program:'Swim Safely — Spring'},
{id:4,name:'Casey Rivera',email:'casey@ymca.org',role:'Partner',program:'Swim Safely — North YMCA'}
],tasks:[
{id:1,title:'Confirm pool access and lane allocation',project:'Swim Safely — Spring',due:'Apr 3, 2026',owner:'Jordan Lee',status:'In progress'},
{id:2,title:'Prepare family welcome materials',project:'Swim Safely — Spring',due:'Apr 4, 2026',owner:'Taylor Brooks',status:'Not started'},
{id:3,title:'Confirm instructor assignments',project:'Swim Safely — Spring',due:'Apr 2, 2026',owner:'Alex Morgan',status:'Complete'},
{id:4,title:'Share post-clinic community resources',project:'Swim Safely — Spring',due:'Apr 13, 2026',owner:'Jordan Lee',status:'Not started'}
],projects:[
{name:'Swim Safely — Spring',site:'University Aquatic Center',start:'Apr 6, 2026',end:'Apr 10, 2026',status:'In progress',progress:72},
{name:'Swim Safely — North YMCA',site:'North YMCA',start:'May 18, 2026',end:'May 22, 2026',status:'Planning',progress:28},
{name:'Swim Safely — Winter',site:'University Aquatic Center',start:'Feb 9, 2026',end:'Feb 13, 2026',status:'Completed',progress:100}
],archive:[
{name:'Swim Safely — Winter',site:'University Aquatic Center',plannedStart:'Feb 9, 2026',actualStart:'Feb 9, 2026',plannedEnd:'Feb 13, 2026',actualEnd:'Feb 13, 2026',status:'On schedule',diff:'0 days',notes:'All five clinic days were delivered as scheduled. Families received community swim lesson referrals at program close.'},
{name:'Swim Safely — Fall',site:'South YMCA',plannedStart:'Oct 6, 2025',actualStart:'Oct 8, 2025',plannedEnd:'Oct 10, 2025',actualEnd:'Oct 12, 2025',status:'Delayed',diff:'2 days late',notes:'Facility availability shifted the clinic start by two days. The five-day sequence remained consecutive.'}
]};
const skills=['Breath control','Floating','Kicking','Rolling','Self-rescue'];
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function canAdmin(){return state.role==='Admin'}
function setPage(p){state.page=p;render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;setPage(b.dataset.page)});
$('#roleSelect').addEventListener('change',e=>{state.role=e.target.value;$('#profileRole').textContent=state.role==='Admin'?'Administrator':state.role;$('#profileName').textContent=state.role==='Admin'?'Alex Morgan':state.role==='Staff'?'Jordan Lee':'Casey Rivera';if(!canAdmin()&&state.page==='archive'||!canAdmin()&&state.page==='users')state.page='dashboard';render()});
function head(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">NO MORE UNDER · PROGRAM WORKSPACE</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function stat(label,num,desc,icon){return `<div class="card stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${num}</strong><small>${desc}</small></div>`}
function badge(s){let c=s==='Completed'||s==='On schedule'?'green':s==='Delayed'?'red':s==='In progress'?'amber':'';return `<span class="pill ${c}">${esc(s)}</span>`}
function dashboard(){let tasks=state.tasks.filter(t=>state.role==='Admin'||t.owner==='Jordan Lee'||state.role==='Partner'&&t.project.includes('North'));return head('Good morning, '+(state.role==='Admin'?'Alex':'there')+' 👋','Here’s what is happening across your Swim Safely programs today.')+
`<div class="cards">${stat('Active programs','2','Across partner sites','▤')}${stat('Tasks to complete',tasks.filter(t=>t.status!=='Complete').length,'Assigned to your workspace','✓')}${stat('Completed clinics','1','Archived programs','▣')}${stat('Upcoming clinic','Apr 6','Next planned start date','◷')}</div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h2>Program progress</h2><p>Current and upcoming Swim Safely clinics</p></div><button class="linkbtn" onclick="setPage('projects')">View all →</button></div>
${state.projects.filter(p=>p.status!=='Completed').map(p=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.name)}</b>${badge(p.status)}</div><small class="muted">${esc(p.site)} · ${esc(p.start)} – ${esc(p.end)}</small><div class="progress" style="margin-top:11px"><span style="width:${p.progress}%"></span></div><small class="muted">${p.progress}% prepared</small></div>`).join('')}</section>
<section class="panel"><div class="panelhead"><div><h2>My tasks</h2><p>Next actions that need attention</p></div><button class="linkbtn" onclick="setPage('tasks')">View tasks →</button></div>
${tasks.slice(0,4).map(t=>`<div class="taskrow ${t.status==='Complete'?'done':''}"><div class="check">${t.status==='Complete'?'✓':''}</div><div class="taskmeta"><b>${esc(t.title)}</b><small>Due ${esc(t.due)} · ${esc(t.status)}</small></div></div>`).join('')}</section></div>
<section class="panel"><div class="panelhead"><div><h2>Five-day clinic model</h2><p>Swim Safely introduces one foundational survival skill each day.</p></div></div><div class="daylist">${skills.map((s,i)=>`<div class="day"><div class="num">Day ${i+1}</div><b>${s}</b><small>Water safety · In-water lesson · Group debrief</small></div>`).join('')}</div></section>`;
}
function projects(){return head('Projects','Manage five-day Swim Safely clinics and their preparation.')+`<section class="panel"><div class="panelhead"><div><h2>All programs</h2><p>Each Swim Safely clinic runs for five consecutive days.</p></div>${canAdmin()?'<button class="btn" onclick="projectModal()">＋ New project</button>':''}</div><div class="tablewrap"><table><thead><tr><th>Program</th><th>Site</th><th>Clinic dates</th><th>Status</th><th>Preparation</th></tr></thead><tbody>${state.projects.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.site)}</td><td>${esc(p.start)} – ${esc(p.end)}</td><td>${badge(p.status)}</td><td style="min-width:130px"><div class="progress"><span style="width:${p.progress}%"></span></div><small class="muted">${p.progress}%</small></td></tr>`).join('')}</tbody></table></div></section>`}
function tasks(){let list=state.tasks.filter(t=>state.role==='Admin'||t.owner==='Jordan Lee'||state.role==='Partner'&&t.project.includes('North'));return head('My Tasks','Keep track of your assigned work, due dates, and updates.')+`<section class="panel"><div class="panelhead"><div><h2>Assigned to me</h2><p>Update your own tasks and add context for teammates.</p></div></div>${list.map(t=>`<div class="taskrow ${t.status==='Complete'?'done':''}"><button class="check" onclick="toggleTask(${t.id})">${t.status==='Complete'?'✓':''}</button><div class="taskmeta"><b>${esc(t.title)}</b><small>${esc(t.project)} · Due ${esc(t.due)}</small></div><select class="field" style="min-width:130px;padding:7px" onchange="changeTask(${t.id},this.value)"><option ${t.status==='Not started'?'selected':''}>Not started</option><option ${t.status==='In progress'?'selected':''}>In progress</option><option ${t.status==='Complete'?'selected':''}>Complete</option></select><button class="linkbtn" onclick="noteModal(${t.id})">Add note</button></div>`).join('')||'<div class="empty">No tasks are assigned to this account.</div>'}</section>`}
function users(){if(!canAdmin())return denied();return head('User Management','Manage platform access, roles, program assignments, and task ownership.',`<button class="btn" onclick="userModal()">＋ Add user</button>`)+`<section class="panel"><div class="panelhead"><div><h2>Platform users</h2><p>Access is determined by each user's role.</p></div></div><div class="toolbar"><input class="field search" id="userSearch" placeholder="Search by name or email…" oninput="filterUsers()"><select class="field" id="roleFilter" onchange="filterUsers()"><option value="">All roles</option><option>Admin</option><option>Staff</option><option>Partner</option></select></div><div class="tablewrap"><table><thead><tr><th>User</th><th>Role</th><th>Program access</th><th>Open tasks</th><th>Actions</th></tr></thead><tbody id="userRows">${userRows(state.users)}</tbody></table></div><div class="section-note"><b>Role guidance:</b> Admins manage projects, templates, users, and all tasks. Staff update their own tasks and view assigned project information. Partner access is planned for Phase 2 and is limited to the assigned program.</div></section>`}
function userRows(arr){return arr.map(u=>`<tr><td><div class="rowtitle"><div class="miniavatar">${u.name.split(' ').map(x=>x[0]).join('')}</div><div><strong>${esc(u.name)}</strong><small class="muted" style="display:block">${esc(u.email)}</small></div></div></td><td>${badge(u.role+(u.role==='Partner'?' · Phase 2':''))}</td><td>${esc(u.program)}</td><td>${state.tasks.filter(t=>t.owner===u.name&&t.status!=='Complete').length}</td><td><div class="actions"><button class="linkbtn" onclick="userModal(${u.id})">Edit</button><button class="linkbtn" onclick="reassignModal(${u.id})">Reassign</button><button class="linkbtn" style="color:var(--red)" onclick="removeUser(${u.id})">Remove</button></div></td></tr>`).join('')}
function filterUsers(){let q=$('#userSearch').value.toLowerCase(),r=$('#roleFilter').value;$('#userRows').innerHTML=userRows(state.users.filter(u=>(!r||u.role===r)&&(u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q))))}
function archive(){if(!canAdmin())return denied();return head('Project Archive','Review completed Swim Safely programs and compare planned versus actual timelines.')+`<section class="panel"><div class="panelhead"><div><h2>Archived programs</h2><p>Each record represents one completed five-day clinic.</p></div><span class="pill green">${state.archive.length} archived</span></div><div class="toolbar"><input id="archiveSearch" class="field search" placeholder="Search archived programs…" oninput="filterArchive()"><select id="archiveSite" class="field" onchange="filterArchive()"><option value="">All sites</option>${[...new Set(state.archive.map(a=>a.site))].map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="archiveStatus" class="field" onchange="filterArchive()"><option value="">All schedule statuses</option><option>On schedule</option><option>Delayed</option></select></div><div class="tablewrap"><table><thead><tr><th>Program name</th><th>Site</th><th>Planned dates</th><th>Actual dates</th><th>Schedule status</th><th>Difference</th><th></th></tr></thead><tbody id="archiveRows">${archiveRows(state.archive)}</tbody></table></div><div class="section-note">Archive access is restricted to Admin roles. Staff and Partner accounts cannot view past program records.</div></section>`}
function archiveRows(arr){return arr.map((a,i)=>`<tr><td><strong>${esc(a.name)}</strong></td><td>${esc(a.site)}</td><td>${esc(a.plannedStart)}<br><small class="muted">to ${esc(a.plannedEnd)}</small></td><td>${esc(a.actualStart)}<br><small class="muted">to ${esc(a.actualEnd)}</small></td><td>${badge(a.status)}</td><td>${esc(a.diff)}</td><td><button class="linkbtn" onclick="showArchive(${state.archive.indexOf(a)})">View details →</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No archived programs match your search.</td></tr>'}
function filterArchive(){let q=$('#archiveSearch').value.toLowerCase(),s=$('#archiveSite').value,t=$('#archiveStatus').value;$('#archiveRows').innerHTML=archiveRows(state.archive.filter(a=>(!q||a.name.toLowerCase().includes(q)||a.site.toLowerCase().includes(q))&&(!s||a.site===s)&&(!t||a.status===t)))}
function showArchive(i){state.selected=i;let a=state.archive[i];$('#view').innerHTML=head(a.name,'Archived program details · '+a.site,`<button class="btn secondary" onclick="setPage('archive')">← Back to Archive</button>`)+`<div class="cards">${stat('Clinic duration','5 days','Consecutive instruction days','◷')}${stat('Schedule outcome',a.status,'Planned vs. actual','▤')}${stat('Schedule difference',a.diff,'Completion date variance','↔')}${stat('Skill progression','5','Foundational survival skills','✓')}</div><section class="panel"><div class="panelhead"><div><h2>Planned vs. actual schedule</h2><p>Compare the intended clinic window with the dates delivered.</p></div>${badge(a.status)}</div><div class="compare"><div class="datebox"><small>Planned clinic</small><b>${esc(a.plannedStart)} – ${esc(a.plannedEnd)}</b></div><div class="datebox"><small>Actual clinic</small><b>${esc(a.actualStart)} – ${esc(a.actualEnd)}</b></div></div></section><section class="panel"><div class="panelhead"><div><h2>Five-day skill progression</h2><p>One foundational survival skill is introduced each day.</p></div></div><div class="daylist">${skills.map((s,i)=>`<div class="day"><div class="num">Day ${i+1}</div><b>${s}</b><small>${dateOffset(a.actualStart,i)}</small></div>`).join('')}</div><div class="section-note">Each day includes a water safety message, an in-water swim lesson, and a group debrief.</div></section><section class="panel"><div class="panelhead"><div><h2>Daily milestone comparison</h2><p>Planned and actual dates for each lesson day.</p></div></div><div class="tablewrap"><table><thead><tr><th>Milestone</th><th>Planned date</th><th>Actual date</th><th>Difference</th></tr></thead><tbody>${skills.map((s,i)=>`<tr><td><strong>Day ${i+1} · ${s}</strong></td><td>${dateOffset(a.plannedStart,i)}</td><td>${dateOffset(a.actualStart,i)}</td><td>${a.diff==='0 days'?'On schedule':a.diff}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="panelhead"><h2>Program notes & follow-up</h2></div><p class="muted">${esc(a.notes)}</p><div class="section-note"><b>After the clinic:</b> Families should be connected to external community swim lesson resources and partners to support continued learning.</div></section>`}
function dateOffset(str,n){let d=new Date(str+', 12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function denied(){return head('Restricted access','This section is available to Admin users only.')+`<div class="access">🔒 <div><b>Admin permission required</b><br>Your current role does not have permission to view this area. Switch to Admin using the role preview in the sidebar to review this screen.</div></div>`}
function render(){document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('#crumb').textContent=({dashboard:'Dashboard',projects:'Projects',tasks:'My Tasks',users:'User Management',archive:'Archive'})[state.page];$('#view').innerHTML=({dashboard,projects,tasks,users,archive})[state.page]();if(state.page==='archive'&&!canAdmin())$('#view').innerHTML=denied()}
function modal(title,desc,body,submit,label='Save changes'){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><p>${desc}</p>${body}<div class="modalactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" id="modalSubmit">${label}</button></div></div></div>`;$('#modalSubmit').onclick=submit}
function closeModal(){$('#modalRoot').innerHTML=''}
function userModal(id){let u=state.users.find(x=>x.id===id)||{name:'',email:'',role:'Staff',program:'Swim Safely — Spring'};modal(id?'Edit user':'Add user','Set the account details and platform role.',`<div class="formgrid"><div class="formgroup"><label>Full name</label><input id="uName" value="${esc(u.name)}"></div><div class="formgroup"><label>Email address</label><input id="uEmail" type="email" value="${esc(u.email)}"></div></div><div class="formgroup"><label>Role</label><select id="uRole"><option ${u.role==='Admin'?'selected':''}>Admin</option><option ${u.role==='Staff'?'selected':''}>Staff</option><option ${u.role==='Partner'?'selected':''}>Partner</option></select></div><div class="formgroup"><label>Program access</label><select id="uProgram"><option>All programs</option><option>Swim Safely — Spring</option><option>Swim Safely — North YMCA</option></select></div><div class="section-note">Admin: manage projects, templates, users, and tasks. Staff: manage own tasks and view assigned projects. Partner: assigned program only (Phase 2).</div>`,()=>{let name=$('#uName').value.trim(),email=$('#uEmail').value.trim();if(!name||!email){toast('Enter a name and email address.');return}let data={name,email,role:$('#uRole').value,program:$('#uProgram').value};if(id)Object.assign(u,data);else state.users.push({id:Date.now(),...data});closeModal();render();toast(id?'User updated':'User added')},id?'Save user':'Add user')}
function reassignModal(id){let u=state.users.find(x=>x.id===id),open=state.tasks.filter(t=>t.owner===u.name&&t.status!=='Complete');if(!open.length){toast('This user has no open tasks to reassign.');return}modal('Reassign open tasks',`Move unfinished tasks from ${u.name} to another team member.`,`<div class="formgroup"><label>Current owner</label><input value="${esc(u.name)}" disabled></div><div class="formgroup"><label>Tasks to reassign</label>${open.map(t=>`<label style="font-weight:500"><input type="checkbox" checked value="${t.id}" class="taskchoice"> ${esc(t.title)} <span class="muted">· ${esc(t.due)}</span></label>`).join('')}</div><div class="formgroup"><label>Reassign to</label><select id="newOwner">${state.users.filter(x=>x.id!==id&&x.role!=='Partner').map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div>`,()=>{let ids=[...document.querySelectorAll('.taskchoice:checked')].map(x=>+x.value),to=$('#newOwner').value;state.tasks.filter(t=>ids.includes(t.id)).forEach(t=>t.owner=to);closeModal();render();toast(ids.length+' task(s) reassigned to '+to)},'Confirm reassignment')}
function removeUser(id){let u=state.users.find(x=>x.id===id);if(!confirm('Remove '+u.name+' from this prototype? Open tasks should be reassigned first.'))return;if(state.tasks.some(t=>t.owner===u.name&&t.status!=='Complete')){toast('Reassign open tasks before removing this user.');return}state.users=state.users.filter(x=>x.id!==id);render();toast('User removed')}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);t.status=t.status==='Complete'?'In progress':'Complete';render()}
function changeTask(id,v){state.tasks.find(x=>x.id===id).status=v;render();toast('Task status updated')}
function noteModal(id){let t=state.tasks.find(x=>x.id===id);modal('Add task note',t.title,`<div class="formgroup"><label>Note</label><textarea id="taskNote" placeholder="Add an update or reminder…"></textarea></div>`,()=>{let n=$('#taskNote').value.trim();if(!n){toast('Write a note first.');return}t.note=n;closeModal();toast('Note saved in this prototype')},'Save note')}
function projectModal(){modal('Create a program','Create a five-consecutive-day Swim Safely clinic.',`<div class="formgroup"><label>Program name</label><input id="pName" placeholder="Swim Safely — Summer"></div><div class="formgrid"><div class="formgroup"><label>Site</label><input id="pSite" placeholder="University facility"></div><div class="formgroup"><label>Day 1 start date</label><input id="pStart" type="date"></div></div><div class="section-note">The five-day clinic dates are calculated as five consecutive days beginning on Day 1.</div>`,()=>{let name=$('#pName').value.trim(),site=$('#pSite').value.trim(),start=$('#pStart').value;if(!name||!site||!start){toast('Complete all program fields.');return}let d=new Date(start+'T12:00:00'),end=new Date(d);end.setDate(end.getDate()+4);let fmt=x=>x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});state.projects.unshift({name,site,start:fmt(d),end:fmt(end),status:'Planning',progress:0});closeModal();setPage('projects');toast('Five-day program created')},'Create program')}
render();
</script>
</body></html>
