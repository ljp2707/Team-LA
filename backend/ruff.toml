# Lint rules (findings F41). Run from backend:  ruff check .
target-version = "py312"
line-length = 120

[lint]
# E4, E7, E9, F: real errors (unused imports, undefined names, syntax).
# B: likely bugs. S: security checks (the Bandit rules).
select = ["E4", "E7", "E9", "F", "B", "S"]
# B008: FastAPI's Depends(...) in defaults is the framework's normal pattern.
ignore = ["B008"]

[lint.per-file-ignores]
# Tests use assert, short names and fake secrets on purpose.
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607", "E741", "B007", "B011", "B905"]
